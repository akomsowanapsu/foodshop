<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order System</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            padding: 40px;
            color: #24292f;
        }
        .order-container {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            cursor: pointer;
        }
        .menu-item input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            padding: 6px 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
        }
        button:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2>Select Your Order</h2>
    <form id="orderForm">
        <label class="menu-item">
            <input type="checkbox" name="food" value="Burger ($8.99)"> Burger ($8.99)
        </label>
        <label class="menu-item">
            <input type="checkbox" name="food" value="Pizza ($12.49)"> Pizza ($12.49)
        </label>
        <label class="menu-item">
            <input type="checkbox" name="food" value="Fries ($3.50)"> Fries ($3.50)
        </label>
        <label class="menu-item">
            <input type="checkbox" name="food" value="Soda ($2.00)"> Soda ($2.00)
        </label>
        
        <button type="button" onclick="saveOrder()">Save Order to Text File</button>
    </form>
</div>

<script>
function saveOrder() {
    // 1. Get all checked checkboxes
    const checkboxes = document.querySelectorAll('input[name="food"]:checked');
    
    // 2. Check if anything is selected
    if (checkboxes.length === 0) {
        alert("Please select at least one item.");
        return;
    }

    // 3. Build the text content
    let textContent = "--- FOOD ORDER RECEIPT ---\n";
    textContent += "Date: " + new Date().toLocaleString() + "\n\n";
    textContent += "Ordered Items:\n";
    
    checkboxes.forEach((checkbox) => {
        textContent += `- [x] ${checkbox.value}\n`; // GitHub markdown style
    });

    // 4. Create a Blob and trigger download
    const blob = new Blob([textContent], { type: "text/plain" });
    const link = document.createElement("a");
    
    link.download = "food-order.txt";
    link.href = URL.createObjectURL(blob);
    
    // 5. Click the hidden link to download
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
