<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order Form</title>
</head>
<body>
    <h2>Place Your Food Order</h2>
    <form action="send_order.php" method="POST">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="food">Select Food Item:</label><br>
        <select id="food" name="food">
            <option value="Pizza">Pizza</option>
            <option value="Burger">Burger</option>
            <option value="Sushi">Sushi</option>
        </select><br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required><br><br>

        <button type="submit" name="submit">Send Order</button>
    </form>
</body>
</html>
