<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #06C755; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #05b34c; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Place Your Order</h2>
    <!-- Replace the action URL with your Formspree or custom backend URL -->
    <form action="https://formspree.io" method="POST">
        
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="Customer Name" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="Phone Number" required>
        </div>

        <div class="form-group">
            <label for="product">Select Product:</label>
            <select id="product" name="Product Ordered" required>
                <option value="">-- Choose an item --</option>
                <option value="Item A - $10">Item A - $10</option>
                <option value="Item B - $20">Item B - $20</option>
                <option value="Item C - $30">Item C - $30</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="Quantity" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label for="address">Delivery Address:</label>
            <textarea id="address" name="Shipping Address" rows="3" required></textarea>
        </div>

        <button type="submit">Submit Order</button>
    </form>
</div>

</body>
</html>
