<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save Checkboxes to File</title>
</head>
<body>

    <h3>Select Options to Save:</h3>
    <label><input type="checkbox" class="save-cb" value="Option 1"> Option 1</label><br>
    <label><input type="checkbox" class="save-cb" value="Option 2"> Option 2</label><br>
    <label><input type="checkbox" class="save-cb" value="Option 3"> Option 3</label><br><br>

    <button id="downloadBtn">Save Selected to Text File</button>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            // 1. Gather all checked values
            let selectedValues = [];
            const checkboxes = document.querySelectorAll('.save-cb:checked');
            
            checkboxes.forEach((cb) => {
                selectedValues.push(cb.value);
            });

            if (selectedValues.length === 0) {
                alert("Please select at least one checkbox!");
                return;
            }

            // 2. Convert the array into a plain string separated by newlines
            const fileText = selectedValues.join('\n');

            // 3. Create a Blob containing the text data
            const blob = new Blob([fileText], { type: 'text/plain' });

            // 4. Create a temporary download link and trigger it
            const downloadLink = document.createElement('a');
            downloadLink.download = 'selected_options.txt';
            downloadLink.href = window.URL.createObjectURL(blob);
            downloadLink.style.display = 'none';
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            
            // Clean up the DOM
            document.body.removeChild(downloadLink);
        });
    </script>

</body>
</html>
