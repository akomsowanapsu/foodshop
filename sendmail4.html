<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two-Column Table Form</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; vertical-align: middle; }
        th { background: #f4f4f4; }
        .sub-col { display: flex; gap: 5px; align-items: center; }
        textarea { width: 100%; height: 80px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Multi-Column Form</h2>
    <form id="myForm">
        <table>
            <thead>
                <tr>
                    <!-- Two Main Columns (Header spans) -->
                    <th colspan="1">Main Column 1</th>
                    <th colspan="1">Main Column 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- 3 Sub-columns for Main Column 1 -->
                    <td>
                        <div class="sub-col">
                            <input type="checkbox" name="chk1" value="Item 1">
                            <input type="text" name="txt1_a" placeholder="Val A">
                            <input type="text" name="txt1_b" placeholder="Val B">
                        </div>
                    </td>
                    

                    <!-- 3 Sub-columns for Main Column 2 -->
                    <td>
                        <div class="sub-col">
                            <input type="checkbox" name="chk4" value="Item 4">
                            <input type="text" name="txt4_a" placeholder="Val A">
                            <input type="text" name="txt4_b" placeholder="Val B">
                        </div>
                    </td>
                
                   
                </tr>
            </tbody>
        </table>

        <button type="button" onclick="saveToMessage()">Save to Message</button>
        
        <div>
            <h3>Output Message:</h3>
            <textarea id="outputMessage" readonly></textarea>
        </div>
    </form>

    <script>
        function saveToMessage() {
            const form = document.getElementById('myForm');
            const checkboxes = form.querySelectorAll('input[type="checkbox"]');
            let message = "Selected Items & Values:\n";

            checkboxes.forEach((chk) => {
                if (chk.checked) {
                    const parentDiv = chk.closest('.sub-col');
                    const textInputs = parentDiv.querySelectorAll('input[type="text"]');
                    let textValues = Array.from(textInputs).map(input => input.value || '[empty]').join(', ');
                    message += `- ${chk.value}: ${textValues}\n`;
                }
                
            });

            document.getElementById('outputMessage').value = message;
        }
    </script>

</body>
</html>
